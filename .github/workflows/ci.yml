name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: ruff (Python; settings in ruff.toml)
        run: pipx run ruff==0.17.3 check .

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build the API image (same as docker compose)
        run: docker build -t filesanitizer-api ./backend
      - name: Backend tests inside the image
        # Run as root from the repo root: some tests write to /var/lib/clamav or read test-files/ and the Dockerfile.
        run: |
          docker run --rm --user root -v "$PWD:/src:ro" --entrypoint sh filesanitizer-api -c \
            "cp -r /src /tmp/repo && cd /tmp/repo && python -m pytest -c backend/pytest.ini --rootdir backend -q -p no:cacheprovider backend/tests"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
