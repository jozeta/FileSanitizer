# ruff (app standards QA-LINT-1). Ruff 0.17+ turns on a very broad rule set by default, so this
# picks the checks that find real bugs: syntax errors, undefined names, unused imports and
# variables, and other pyflakes errors. Three style rules stay off for the existing code:
#   E701 one-line "if x: y" statements, E741 the names l/O/I, E402 late imports (mostly deliberate,
#   to avoid import cycles). See them with: uvx ruff check --select E701,E741,E402 .
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E741", "E402"]
